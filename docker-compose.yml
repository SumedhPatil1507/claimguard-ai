version: "3.9"

# ---------------------------------------------------------------------------
# ClaimGuard AI — Docker Compose stack
#
# Services
# --------
#   redis          Redis 7 — Celery broker + result backend
#   celery-worker  Celery worker (concurrency 4, loglevel info)
#   api            FastAPI on :8000
#   frontend       Streamlit on :8501
#   postgres       PostgreSQL 15 on :5432
#   neo4j          Neo4j 5 on :7474 / :7687
#   prometheus     Prometheus on :9090
#   grafana        Grafana on :3000
#
# Dependency order
# ----------------
#   redis → celery-worker
#   redis + postgres → api
#   api → frontend
#   prometheus → grafana
# ---------------------------------------------------------------------------

x-common-env: &common-env
  PYTHONPATH: /app
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://claimguard:claimguard_pass@postgres:5432/claimguard
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: neo4jpass

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --save 60 1 --loglevel warning

  # ── Celery worker ──────────────────────────────────────────────────────────
  celery-worker:
    build: .
    restart: unless-stopped
    command: >
      celery -A src.worker worker
        --loglevel=info
        --concurrency=4
        --queues=celery
        --without-heartbeat
        --without-gossip
        --without-mingle
    env_file: .env
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Celery inspect ping checks that at least one worker is alive
      test:
        - "CMD"
        - "celery"
        - "-A"
        - "src.worker"
        - "inspect"
        - "ping"
        - "--timeout=10"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/app/data   # share model artefacts between API and worker

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data

  # ── Streamlit frontend ─────────────────────────────────────────────────────
  frontend:
    build: .
    restart: unless-stopped
    command: >
      streamlit run app/app.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      <<: *common-env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claimguard
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: claimguard_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  prometheus_data:
  grafana_data:
